<div class="card shadow-sm mb-4">
  <div class="card-header bg-white py-3 border-bottom">
    <h5 class="mb-0 text-primary fw-bold"><i class="bi bi-calendar2-x me-2"></i>Duyệt Đơn Nghỉ Phép</h5>
  </div>

  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover table-striped align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th class="ps-3">Mã NV</th>
            <th>Tên nhân viên</th>
            <th>Từ ngày</th>
            <th>Đến ngày</th>
            <th>Lý do</th>
            <th>Trạng thái</th>
            <th class="text-center">Thao tác</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let l of leaves">
            <td class="ps-3 fw-medium">{{ l.employeeCode }}</td>
            <td class="fw-bold">{{ l.employeeName }}</td>
            <td>{{ l.startDate | date:'dd/MM/yyyy' }}</td>
            <td>{{ l.endDate | date:'dd/MM/yyyy' }}</td>
            <td class="text-truncate" style="max-width: 200px;" [title]="l.reason">{{ l.reason }}</td>
            <td>
              <span class="badge"
                    [ngClass]="{'bg-warning text-dark': l.status === 'Pending', 'bg-success': l.status === 'Approved', 'bg-danger': l.status === 'Rejected'}">
                {{ l.status }}
              </span>
            </td>
            <td class="text-center">
              <button *ngIf="l.status === 'Pending'" class="btn btn-sm btn-success me-1" (click)="approveLeave(l.id)" title="Duyệt"><i class="bi bi-check-lg"></i> Duyệt</button>
              <button *ngIf="l.status === 'Pending'" class="btn btn-sm btn-danger" (click)="rejectLeave(l.id)" title="Từ chối"><i class="bi bi-x-lg"></i> Từ chối</button>
            </td>
          </tr>
          <tr *ngIf="leaves.length === 0 && !isLoading">
            <td colspan="7" class="text-center py-5 text-muted">Không có đơn xin nghỉ nào cần xử lý.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
