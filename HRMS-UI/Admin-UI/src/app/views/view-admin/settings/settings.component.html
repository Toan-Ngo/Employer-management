<div class="card shadow-sm mb-4">
  <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
    <h5 class="mb-0 text-primary fw-bold">
      <i class="bi bi-palette2 me-2"></i>Tùy Chỉnh Giao Diện Cá Nhân
    </h5>
    <button class="btn btn-outline-secondary btn-sm" (click)="resetSettings()">
      <i class="bi bi-arrow-counterclockwise me-1"></i>Khôi phục mặc định
    </button>
  </div>

  <div class="card-body">
    <div class="row">
      <div class="col-md-6 border-end">
        <h6 class="text-muted fw-bold mb-3 small text-uppercase">Màu sắc & Chủ đề</h6>

        <div class="mb-4">
          <label class="form-label d-block">Màu chữ hệ thống</label>
          <div class="d-flex align-items-center">
            <input type="color" class="form-control form-control-color me-2"
                   [(ngModel)]="settings.textColor" (input)="onSettingsChange()">
            <span class="small">{{settings.textColor}}</span>
          </div>
        </div>

        <div class="mb-4">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" role="switch" id="darkModeSwitch"
                   [(ngModel)]="settings.isDarkMode" (change)="onSettingsChange()">
            <label class="form-check-label ms-2" for="darkModeSwitch">Chế độ tối (Dark Mode)</label>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Độ sáng màn hình: <span class="text-primary">{{settings.brightness}}%</span></label>
          <input type="range" class="form-range" min="50" max="150" step="10"
                 [(ngModel)]="settings.brightness" (input)="onSettingsChange()">
        </div>
      </div>

      <div class="col-md-6 ps-md-4">
        <h6 class="text-muted fw-bold mb-3 small text-uppercase">Văn bản & Bố cục</h6>

        <div class="mb-4">
          <label class="form-label">Cỡ chữ (Font size): <span class="text-primary">{{settings.fontSize}}px</span></label>
          <input type="range" class="form-range" min="12" max="22" step="1"
                 [(ngModel)]="settings.fontSize" (input)="onSettingsChange()">
        </div>

        <div class="mb-4">
          <label class="form-label">Khoảng cách dòng: <span class="text-primary">{{settings.lineHeight}}</span></label>
          <input type="range" class="form-range" min="1" max="2" step="0.1"
                 [(ngModel)]="settings.lineHeight" (input)="onSettingsChange()">
        </div>

        <div class="mb-3">
          <label class="form-label">Độ bo góc (Border radius): <span class="text-primary">{{settings.borderRadius}}px</span></label>
          <input type="range" class="form-range" min="0" max="20" step="2"
                 [(ngModel)]="settings.borderRadius" (input)="onSettingsChange()">
        </div>
      </div>
    </div>
  </div>

  <div class="card-footer bg-light py-2">
    <small class="text-muted"><i class="bi bi-info-circle me-1"></i>Cài đặt này được lưu tại trình duyệt của bạn.</small>
  </div>
</div>
