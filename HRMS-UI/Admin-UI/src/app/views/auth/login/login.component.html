<div class="bg-light dark:bg-transparent min-vh-100 d-flex flex-row align-items-center">
  <c-container>
    <c-row class="justify-content-center">
      <c-col md="10" lg="8" xl="6">
        <c-card-group class="shadow-lg border-0 rounded-4 overflow-hidden">

          <c-card class="p-4 p-md-5 border-0">
            <c-card-body>

              <div *ngIf="mode === 'login'" class="animate-fade">
                <form cForm [formGroup]="loginForm" (ngSubmit)="login()">
                  <h2 class="fw-bold text-primary mb-1">ĐĂNG NHẬP</h2>
                  <p class="text-muted mb-4 small">Hệ thống Quản trị Nhân sự HRMS</p>

                  <c-input-group class="mb-3 shadow-sm rounded">
                    <span cInputGroupText class="bg-white border-end-0">
                      <svg cIcon name="cilUser" class="text-primary"></svg>
                    </span>
                    <input autoComplete="username" class="border-start-0 ps-0" cFormControl formControlName="userName" placeholder="Tên đăng nhập" />
                  </c-input-group>

                  <c-input-group class="mb-3 shadow-sm rounded">
                    <span cInputGroupText class="bg-white border-end-0">
                      <svg cIcon name="cilLockLocked" class="text-primary"></svg>
                    </span>
                    <input autoComplete="current-password" class="border-start-0 ps-0" cFormControl formControlName="password" type="password" placeholder="Mật khẩu" />
                  </c-input-group>

                  <div class="d-flex justify-content-end mb-4">
                    <a href="javascript:void(0)" (click)="switchMode('forgot')" class="text-decoration-none small text-primary fw-medium">Quên mật khẩu?</a>
                  </div>

                  <button cButton color="primary" class="w-100 py-2 fw-bold text-white shadow-sm" type="submit" [disabled]="loading">
                    <c-spinner *ngIf="loading" size="sm" class="me-2"></c-spinner>
                    {{ loading ? 'ĐANG XỬ LÝ...' : 'ĐĂNG NHẬP' }}
                  </button>
                </form>
              </div>

              <div *ngIf="mode === 'forgot'" class="animate-fade">
                <form cForm [formGroup]="forgotForm" (ngSubmit)="requestReset()">
                  <h2 class="fw-bold text-primary mb-1">QUÊN MẬT KHẨU</h2>
                  <p class="text-muted mb-4 small">Nhập Email của bạn để nhận mã OTP khôi phục.</p>

                  <c-input-group class="mb-4 shadow-sm rounded">
                    <span cInputGroupText class="bg-white border-end-0">
                      <svg cIcon name="cilEnvelopeOpen" class="text-primary"></svg>
                    </span>
                    <input cFormControl class="border-start-0 ps-0" formControlName="email" type="email" placeholder="Nhập địa chỉ Email" />
                  </c-input-group>

                  <button cButton color="primary" class="w-100 py-2 fw-bold text-white mb-3 shadow-sm" type="submit" [disabled]="loading || forgotForm.invalid">
                    <c-spinner *ngIf="loading" size="sm" class="me-2"></c-spinner>
                    {{ loading ? 'ĐANG GỬI MÃ...' : 'GỬI MÃ XÁC NHẬN' }}
                  </button>

                  <div class="text-center">
                    <a href="javascript:void(0)" (click)="switchMode('login')" class="text-decoration-none small text-muted hover-primary">
                      <svg cIcon name="cilArrowLeft" class="me-1"></svg> Quay lại đăng nhập
                    </a>
                  </div>
                </form>
              </div>

              <div *ngIf="mode === 'reset'" class="animate-fade">
                <form cForm [formGroup]="resetForm" (ngSubmit)="confirmReset()">
                  <h2 class="fw-bold text-success mb-1">ĐỔI MẬT KHẨU</h2>
                  <p class="text-muted mb-4 small">Mã đã gửi tới <b>{{resetForm.value.email}}</b></p>

                  <c-input-group class="mb-3 shadow-sm rounded">
                    <span cInputGroupText class="bg-white border-end-0">
                      <svg cIcon name="cilBarcode" class="text-success"></svg>
                    </span>
                    <input cFormControl class="border-start-0 ps-0" formControlName="code" placeholder="Mã xác thực (6 ký tự)" maxlength="6" />
                  </c-input-group>

                  <c-input-group class="mb-4 shadow-sm rounded">
                    <span cInputGroupText class="bg-white border-end-0">
                      <svg cIcon name="cilShieldAlt" class="text-success"></svg>
                    </span>
                    <input cFormControl class="border-start-0 ps-0" formControlName="newPassword" type="password" placeholder="Mật khẩu mới (Tối thiểu 6 ký tự)" />
                  </c-input-group>

                  <button cButton color="success" class="w-100 py-2 fw-bold text-white mb-3 shadow-sm" type="submit" [disabled]="loading || resetForm.invalid">
                    <c-spinner *ngIf="loading" size="sm" class="me-2 text-white"></c-spinner>
                    {{ loading ? 'ĐANG ĐỔI...' : 'XÁC NHẬN ĐỔI MẬT KHẨU' }}
                  </button>

                  <div class="text-center">
                    <a href="javascript:void(0)" (click)="switchMode('login')" class="text-decoration-none small text-muted hover-primary">
                      Hủy thao tác
                    </a>
                  </div>
                </form>
              </div>

            </c-card-body>
          </c-card>

          <c-card class="text-white bg-primary d-none d-md-flex align-items-center justify-content-center border-0" [style.width.%]="40">
            <div class="text-center p-4">
              <svg cIcon name="cilLayers" size="9xl" class="mb-3 opacity-50"></svg>
              <h3 class="fw-bold mb-1">HRMS PORTAL</h3>
              <p class="small opacity-75 mb-0">Quản lý hiệu quả, vận hành tối ưu</p>
            </div>
          </c-card>

        </c-card-group>
      </c-col>
    </c-row>
  </c-container>
</div>
